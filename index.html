<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Recall — Login</title>
    <meta name="description"
        content="Acesse o sistema de gestão escolar Mind Recall. Login seguro para Secretaria e Professores.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&family=Poppins:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Tela de Login -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="login-logo">
                <div class="login-logo-icon">M</div>
                <h1>Mind Recall</h1>
                <p class="login-subtitle">Sistema de Gestão Escolar</p>
            </div>
            <form id="form-login">
                <div class="input-group">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username" autocomplete="email" placeholder="seu@email.com"
                        required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password"
                        placeholder="••••••••" required>
                </div>
                <button type="button" id="btn-login">Entrar no Sistema</button>
            </form>
            <div class="login-hint">
                <p>Use o <strong>e-mail e senha</strong> cadastrados no painel do Supabase.</p>
            </div>
        </div>
    </div>

    <!-- Modal de Alerta Global -->
    <div id="modal-alerta" class="modal-overlay">
        <div class="modal-container" style="max-width: 400px;">
            <div class="modal-header">
                <h3 id="alerta-titulo">Aviso</h3>
                <button class="modal-close" onclick="fecharModalAlerta()">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <p id="alerta-mensagem" style="font-size: 1.1em; font-weight: 500;"></p>
            </div>
            <div class="modal-footer" style="justify-content: center;">
                <button class="modal-btn modal-btn-confirm" onclick="fecharModalAlerta()">OK, Entendi</button>
            </div>
        </div>
    </div>

    <!-- CDN do Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Script de login com roteamento RBAC -->
    <script src="login.js"></script>
</body>

</html>
